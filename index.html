<!DOCTYPE html>
<html lang="en">
<head>
  <script defer src="https://analytics.denbroeder.eu/script.js" data-website-id="fd2831d8-8225-4f3a-86fd-261f693626f7"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Exposure Scan</title>
  <link rel="icon" type="image/webp" href="assets/uva-logo.webp">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <!-- Font Awesome (free) - use classes like <i class="fa-solid fa-robot"></i> -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">

</head>
<body>

  <!-- ──────────────────────────────────────────────────────────────────────────
       MODALS
       ────────────────────────────────────────────────────────────────────────── -->

  <!-- Intro overlay -->
  <div id="intro-overlay" class="intro-overlay">
    <div class="intro-box" role="dialog" aria-modal="true" aria-labelledby="intro-title">
      <h2 id="intro-title"></h2>
      <p id="intro-body"></p>
      <div class="intro-footer">
        <button type="button" class="intro-btn" onclick="dismissIntro()" id="intro-cta"></button>
        <div class="lang-switcher">
          <button class="lang-btn active" onclick="setLang('en')">EN</button>
          <button class="lang-btn" onclick="setLang('nl')">NL</button>
        </div>
      </div>
    </div>
  </div>

  <!-- TEMPORARY SITE MIGRATION BLOCKER: comment out this entire block to disable it. -->
  <div id="migration-overlay" class="intro-overlay migration-overlay">
    <div class="intro-box" role="dialog" aria-modal="true" aria-labelledby="migration-title">
      <h2 id="migration-title"></h2>
      <p id="migration-body"></p>
      <div class="intro-footer">
        <button type="button" class="intro-btn" id="migration-save-btn" onclick="saveResult(true)"></button>
        <div class="lang-switcher">
          <button class="lang-btn active" onclick="setLang('en')">EN</button>
          <button class="lang-btn" onclick="setLang('nl')">NL</button>
        </div>
      </div>
    </div>
  </div>
  <!-- END TEMPORARY SITE MIGRATION BLOCKER -->

  <!-- Exposure help overlay -->
  <div id="exposure-help-overlay" class="intro-overlay">
    <div class="intro-box intro-box-scrollable">
      <h2 id="exposure-help-title"></h2>
      <div id="exposure-help-body"></div>
      <button type="button" class="intro-btn" id="exposure-help-close" onclick="closeExposureHelp()">Close</button>
    </div>
  </div>

  <!-- ──────────────────────────────────────────────────────────────────────────
       HEADER
       ────────────────────────────────────────────────────────────────────────── -->

<div id="capture-area">
       <div class="header-bar">
    <div class="uva-logo-wrap">
      <img src="assets/uva-logo.webp" alt="UvA logo">
    </div>

    <div class="header-text">
      <h1 id="header-title"></h1>
      <div class="course-subtitle" id="header-subtitle"></div>
    </div>

    <div class="header-right">
      <button
        type="button"
        id="header-reset-btn"
        class="header-reset-btn hidden"
        onclick="resetState()"
        aria-label="Reset assessment"
      >
        <i class="fa-solid fa-arrow-rotate-left fa-icon" aria-hidden="true"></i>
      </button>

      <button type="button" id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
        &#x25D1;
      </button>

      <a
        class="github-link"
        href="https://github.com/sdb81/airad"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="View this project on GitHub"
        title="View on GitHub"
      >
        <i class="fa-brands fa-github fa-icon" aria-hidden="true"></i>
      </a>

      <div class="lang-switcher">
        <button class="lang-btn" id="lang-en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="lang-nl" onclick="setLang('nl')">NL</button>
      </div>
    </div>
  </div>

  <!-- ──────────────────────────────────────────────────────────────────────────
       MAIN CONTENT
       ────────────────────────────────────────────────────────────────────────── -->

  <div class="main">

  <!-- Course title card -->
  <div class="card">
    <h2 id="label-course-title"></h2>
    <div class="course-title-row">
      <input type="text" class="course-title-input" id="course-title" oninput="updateCourseTitle()" />
      <div class="faculty-select-wrap">
      <select id="faculty-select" class="faculty-select" onchange="updateFaculty()" required>
        <option value="" id="faculty-placeholder" disabled hidden selected style="display:none"></option>
        <option value="AUC" data-abbreviation="AUC">AUC</option>
      </select>
      <span id="faculty-select-display" class="faculty-select-display placeholder" aria-hidden="true">Faculty...</span>
      </div>
    </div>
  </div>

    <!-- Add assessment card -->
    <div class="card hidden" id="add-card">
      <h2 id="label-add-component"></h2>
      <div class="add-row-labels">
        <span class="lbl-type" id="label-type"></span>
        <span class="lbl-pct" id="label-weight"></span>
        <span class="lbl-note" id="label-note-col"></span>
        <span class="lbl-btn"></span>
      </div>
      <div class="add-row">
        <select id="assessment-select"></select>
        <input type="number" id="pct-input" min="1" max="100" />
        <input type="text" id="note-input" maxlength="60" />
        <button onclick="addAssessment()" id="btn-add"></button>
      </div>
    </div>

    <!-- Assessment structure card -->
    <div class="card hidden" id="structure-card">
      <div class="card-header-row">
        <h2 id="label-structure"></h2>
        <button
          type="button"
          class="consult-btn help-btn"
          id="exposure-help-btn"
          onclick="openExposureHelp()"
          title="How are exposure scores decided?"
        >
          ?
        </button>
      </div>
      <div id="assessment-list" aria-live="polite" aria-atomic="false"></div>
    </div>

    <!-- Feedback card -->
    <div class="card hidden" id="feedback-card">
      <h2 id="label-feedback"></h2>
      <div id="feedback-content" aria-live="polite"></div>
    </div>

    <!-- Consult CTA card -->
    <div class="consult-card">
      <p id="consult-text"></p>
      <a
        class="consult-btn"
        id="consult-btn"
        href="#"
        target="_blank"
        rel="noopener"
      ></a>
      <button
        type="button"
        id="header-save-btn"
        class="consult-btn save-result-btn hidden"
        onclick="saveResult()"
      ></button>
    </div>

  </div>
</div>
  <!-- External scripts -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="main.js"></script>
  <!-- Floating Contact Orb -->

  <div id="contact-orb" title="Contact">
    <img id="orb-img" src="assets/Initials.png" alt="Contact">
  </div>  
  <div id="contact-popup"></div>
  <script>
  const orb = document.getElementById('contact-orb');
  const popup = document.getElementById('contact-popup');

  orb.addEventListener('click', (e) => {
      e.stopPropagation();
      popup.classList.toggle('visible');
  });

  document.addEventListener('click', () => {
      popup.classList.remove('visible');
  });

  popup.addEventListener('click', (e) => e.stopPropagation());
  </script>

</body>
</html>
